# Ruff configuration for ZimSite.
# Lint gate: my_env/bin/ruff check .
# Auto-fix safe issues: my_env/bin/ruff check --fix .

target-version = "py312"
line-length = 100

exclude = [
    ".git",
    ".hermes",
    ".ipynb_checkpoints",
    "__pycache__",
    "downloads",
    "my_env",
    "zim_files",
]

[lint]
# Focused, actionable rules: pyflakes, pycodestyle errors, import order,
# bugbear and pyupgrade. Operational rules (BLE/S/LOG) are deliberately out:
# the converter intentionally catches broad exceptions to keep processing files.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
